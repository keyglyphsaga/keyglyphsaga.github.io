name: Check site

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify built book pages and navigation
        run: python3 scripts/check-site.py
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Verify background cross-fades in Chromium
        run: |
          npm run preview -- --host 127.0.0.1 &
          for attempt in $(seq 1 30); do
            curl -fsS http://localhost:4321/ > /dev/null && break
            sleep 1
          done
          node scripts/check-background.mjs
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: background-screenshots
          path: screenshots/
